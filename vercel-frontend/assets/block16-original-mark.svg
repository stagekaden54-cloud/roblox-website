<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">BLOCK16 original geometric mark</title>
  <desc id="desc">An original blue beveled geometric emblem built from interlocking rectangular blocks.</desc>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8fc9f5"/>
      <stop offset=".48" stop-color="#347fbd"/>
      <stop offset="1" stop-color="#174675"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f5ff"/>
      <stop offset="1" stop-color="#78a9d2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#163b5c" flood-opacity=".24"/>
    </filter>
  </defs>
  <g filter="url(#shadow)" stroke="#174675" stroke-width="5" stroke-linejoin="round">
    <path d="M42 46h104l28 28H70v92l-28-28z" fill="url(#edge)"/>
    <path d="M70 74h100v42H112v78H70z" fill="url(#face)"/>
    <path d="M112 116h86v42h-44v36h-42z" fill="#245f96"/>
    <path d="M112 116h86l-28-28h-58z" fill="#b9e1fb" opacity=".88" stroke="none"/>
  </g>
  <path d="M85 88h54" stroke="#e8f7ff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
</svg>