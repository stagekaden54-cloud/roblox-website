<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BLOCK16 classic-era homepage preview using artwork and navigation structure from the legacy website repository.">
  <meta name="theme-color" content="#114081">
  <title>BLOCK16 — Home</title>
  <link rel="icon" href="/assets/block16-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/site-shell.css">
  <script src="/site-shell.js" defer></script>
</head>
<body>
  <header id="header" data-site-header></header>

  <main id="container">
    <p class="navigation-notice">Explore BLOCK16. Create an account or log in to manage your player profile.</p>
    <section class="legacy-games" aria-label="Classic games">
      <div class="crossroads" role="img" aria-label="Crossroads game artwork"></div>
      <div class="swordfight" role="img" aria-label="Swordfight game artwork"></div>
      <div class="seemoregames" role="img" aria-label="More games artwork"></div>
    </section>
  </main>

  <footer id="footer">
    BLOCK16 — independent classic-era revival project.
    <a href="https://github.com/stagekaden54-cloud/roblox-website" target="_blank" rel="noopener noreferrer">View source</a>
    <p class="static-note">BLOCK16 account services are connected to the backend. Game launching is not available yet.</p>
  </footer>
  
</body>
</html>
